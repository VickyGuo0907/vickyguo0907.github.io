  <link rel="stylesheet" href="/styles.css?v=f7a3f077">
  <script>
    /** Forward links from the retired git-home / my-git-home sites to their new location. */
    function oldSiteTarget(path) {
      var m = path.match(/^\/(git-home|my-git-home)(\/.*)?$/);
      if (!m) return null;
      return m[1] === 'git-home' ? (m[2] || '/') : '/';
    }
    var target = oldSiteTarget(location.pathname);
    if (target) location.replace(target + (target === '/' ? '' : location.search + location.hash));
  </script>
</head>
<body>
  <main>
    <section class="closing" aria-labelledby="not-found-title" style="min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center">

      <h2 id="not-found-title">This page took<br>a <em>day off.</em></h2>
      <a class="button button-light" href="/">Back to the homepage</a>
      <p style="margin-top:28px;font-size:14px">Looking for older writing? Try the <a href="/archive/" style="text-decoration:underline">original site archive</a>.</p>
    </section>
  </main>
